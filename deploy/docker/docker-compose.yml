# Local / small-site deployment of Dynamic Cube.
#   docker compose -f deploy/docker/docker-compose.yml up --build
# Optional services (virus scanning): add --profile full
name: dynamic-cube

x-dotnet-env: &dotnet-env
  ConnectionStrings__DynamicCube: Host=postgres;Database=dynamic_cube;Username=dynamic_cube;Password=${POSTGRES_PASSWORD:-dynamic_cube}

# Credentials of the MoMRAH gateway connection (development values for the mock gateway; real ones come from the secret store).
x-gateway-secrets: &gateway-secrets
  Secrets__MOMRAH_GATEWAY__clientId: ${MOMRAH_CLIENT_ID:-dev-consumer-key}
  Secrets__MOMRAH_GATEWAY__clientSecret: ${MOMRAH_CLIENT_SECRET:-dev-consumer-secret}
  # Payment notifications from SADAD are signed with this key (the mock gateway signs with the same one).
  Secrets__SADAD_CALLBACK__key: ${SADAD_CALLBACK_KEY:-dev-sadad-callback-key}
  # Inspection results from the inspection body (CIS) are signed with this key (the mock gateway signs with the same one).
  Secrets__CIS_CALLBACK__key: ${CIS_CALLBACK_KEY:-dev-cis-callback-key}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dynamic_cube
      POSTGRES_USER: dynamic_cube
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dynamic_cube}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dynamic_cube -d dynamic_cube"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Browsers reach Keycloak on localhost:8080; containers on keycloak:8080. Tokens keep one issuer.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - ../keycloak/realms:/opt/keycloak/data/import:ro
      - ../keycloak/themes/dynamic-cube:/opt/keycloak/themes/dynamic-cube:ro
      - ../keycloak/themes/dynamic-cube-internal:/opt/keycloak/themes/dynamic-cube-internal:ro
    ports:
      - "8080:8080"

  migrator:
    build:
      context: ../..
      dockerfile: deploy/docker/dotnet.Dockerfile
      args:
        PROJECT: src/Tools/Migrator/DynamicCube.Migrator.csproj
        ASSEMBLY: DynamicCube.Migrator.dll
    environment:
      <<: *dotnet-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  internal-api:
    build:
      context: ../..
      dockerfile: deploy/docker/dotnet.Dockerfile
      args:
        PROJECT: src/Hosts/Internal.Api/DynamicCube.Internal.Api.csproj
        ASSEMBLY: DynamicCube.Internal.Api.dll
    environment:
      <<: [*dotnet-env, *gateway-secrets]
      Authentication__Internal__Authority: http://keycloak:8080/realms/dynamic-cube-internal
      Authentication__Internal__RequireHttpsMetadata: "false"
      Documents__GotenbergUrl: http://gotenberg:3000
      # Development users get their Apps Control roles on first sign-in.
      AppsControl__BootstrapUsers__admin__0: SYSTEM_ADMIN
      AppsControl__BootstrapUsers__maker__0: CONFIG_MAKER
      AppsControl__BootstrapUsers__checker__0: CONFIG_CHECKER
      # Keycloak here keeps no data and re-imports its realm on a fresh start; accounts follow their username.
      AppsControl__RelinkAccountsByUserName: "true"
      # Employee accounts are created and maintained from Apps Control through Keycloak's admin API.
      AppsControl__Identity__Provider: Keycloak
      AppsControl__Identity__BaseUrl: http://keycloak:8080
      Secrets__KEYCLOAK_ADMIN__clientSecret: dev-accounts-secret
      # Applicants' portal accounts (user name = national ID), in the portal realm.
      AppsControl__PortalIdentity__Provider: Keycloak
      Secrets__KEYCLOAK_PORTAL_ADMIN__clientSecret: dev-portal-accounts-secret
    volumes:
      - files:/data/files
    depends_on:
      migrator:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
    ports:
      - "5080:8080"

  external-api:
    build:
      context: ../..
      dockerfile: deploy/docker/dotnet.Dockerfile
      args:
        PROJECT: src/Hosts/External.Api/DynamicCube.External.Api.csproj
        ASSEMBLY: DynamicCube.External.Api.dll
    environment:
      <<: [*dotnet-env, *gateway-secrets]
      Authentication__External__Authority: http://keycloak:8080/realms/dynamic-cube-external
      Authentication__External__RequireHttpsMetadata: "false"
      Documents__GotenbergUrl: http://gotenberg:3000
    volumes:
      - files:/data/files
    depends_on:
      migrator:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
    ports:
      - "5081:8080"

  # Development stand-in for the MoMRAH gateway (MCI operations, SADAD bills and payment page); connection base URL
  # http://mock-gateway:8080, payment page http://localhost:5090/sadad/pay/{billNumber}, inspection page
  # http://localhost:5090/cis/inspections/{inspectionId}.
  mock-gateway:
    build:
      context: ../..
      dockerfile: deploy/docker/dotnet.Dockerfile
      args:
        PROJECT: src/Tools/MockGateway/DynamicCube.MockGateway.csproj
        ASSEMBLY: DynamicCube.MockGateway.dll
    environment:
      Sadad__CallbackUrl: http://external-api:8080/api/payments/v1/callbacks/SADAD
      Sadad__CallbackKey: ${SADAD_CALLBACK_KEY:-dev-sadad-callback-key}
      Sadad__ReturnUrl: http://localhost:4201/requests
      Cis__CallbackUrl: http://external-api:8080/api/visits/v1/callbacks/SAFETY_INSPECTION
      Cis__CallbackKey: ${CIS_CALLBACK_KEY:-dev-cis-callback-key}
    ports:
      - "5090:8080"

  worker:
    build:
      context: ../..
      dockerfile: deploy/docker/dotnet.Dockerfile
      args:
        PROJECT: src/Hosts/Worker/DynamicCube.Worker.csproj
        ASSEMBLY: DynamicCube.Worker.dll
    environment:
      <<: *dotnet-env
      Documents__GotenbergUrl: http://gotenberg:3000
      # Development mail catcher: every email the platform sends shows at http://localhost:8025.
      Communication__Email__Host: mailpit
      Communication__Email__Port: "1025"
      Communication__Email__Security: None
      Communication__Email__From: no-reply@dynamic-cube.local
      Communication__Email__FromName: Dynamic Cube
    volumes:
      - files:/data/files
    depends_on:
      migrator:
        condition: service_completed_successfully

  # Catches outgoing email in development (SMTP on 1025, web UI on http://localhost:8025).
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"
      - "1025:1025"

  web-internal:
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
      args:
        APP: internal
    environment:
      API_UPSTREAM: http://internal-api:8080
    depends_on:
      - internal-api
    ports:
      - "4200:8080"

  web-external:
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
      args:
        APP: external
    environment:
      API_UPSTREAM: http://external-api:8080
      APP_CODE: EXTERNAL
      AUTH_AUTHORITY: http://localhost:8080/realms/dynamic-cube-external
      AUTH_CLIENT_ID: dynamic-cube-external-web
      AUTH_REQUIRED: "false"
    depends_on:
      - external-api
    ports:
      - "4201:8080"

  web-field:
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
      args:
        APP: field
    environment:
      API_UPSTREAM: http://internal-api:8080
      APP_CODE: FIELD
      AUTH_STORAGE: local
    depends_on:
      - internal-api
    ports:
      - "4202:8080"

  # Prints issued documents to PDF (the APIs on first download, the worker after issuing).
  gotenberg:
    image: gotenberg/gotenberg:8

  clamav:
    image: clamav/clamav:1.4
    profiles: ["full"]

volumes:
  postgres-data:
  files:
